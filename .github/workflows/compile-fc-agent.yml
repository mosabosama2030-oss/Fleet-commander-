name: Compile Fleet Commander Agentic Workflow

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fc-agent.md"
      - ".github/workflows/compile-fc-agent.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fc-agent.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fc-agentic-workflow-compile
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned GitHub Agentic Workflows CLI with checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_AW_INSTALLER_URL: https://raw.githubusercontent.com/github/gh-aw/48d1b1b7142d1748885227a8ac3fe57e8ee36a0b/install-gh-aw.sh
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$GH_AW_INSTALLER_URL" \
            --output "$RUNNER_TEMP/install-gh-aw.sh"
          bash "$RUNNER_TEMP/install-gh-aw.sh" v1.2.2
          echo "$HOME/.local/share/gh/extensions/gh-aw" >> "$GITHUB_PATH"
          "$HOME/.local/share/gh/extensions/gh-aw/gh-aw" version
      - name: Compile and strictly validate
        run: |
          gh aw version
          gh aw compile fc-agent --validate --strict
          test -s .github/workflows/fc-agent.lock.yml

  publish-lock-pr:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned GitHub Agentic Workflows CLI with checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_AW_INSTALLER_URL: https://raw.githubusercontent.com/github/gh-aw/48d1b1b7142d1748885227a8ac3fe57e8ee36a0b/install-gh-aw.sh
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$GH_AW_INSTALLER_URL" \
            --output "$RUNNER_TEMP/install-gh-aw.sh"
          bash "$RUNNER_TEMP/install-gh-aw.sh" v1.2.2
          echo "$HOME/.local/share/gh/extensions/gh-aw" >> "$GITHUB_PATH"
          "$HOME/.local/share/gh/extensions/gh-aw/gh-aw" version
      - name: Compile and strictly validate
        run: |
          gh aw version
          gh aw compile fc-agent --validate --strict
          test -s .github/workflows/fc-agent.lock.yml
      - name: Open a review PR for the generated lock file
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git add .github/workflows/fc-agent.lock.yml
          if git diff --cached --quiet; then
            echo "The generated lock file is already current; no PR is needed."
            exit 0
          fi

          branch="automation/compile-fc-agent-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(agents): compile Fleet Commander agent workflow"
          git push --set-upstream origin "$branch"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "build(agents): add compiled Fleet Commander agent workflow" \
            --body "Generated by the pinned GitHub Agentic Workflows CLI. This PR contains the compiled fc-agent.lock.yml only. Review the generated workflow and its permissions before merging. No auto-merge is enabled; MOSAAB retains merge authority."
