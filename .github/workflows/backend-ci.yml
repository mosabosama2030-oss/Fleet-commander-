name: Backend CI

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Node ${{ matrix.node }} — tests and typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.18.0'
            node-types: '22'
          - node: '24'
            node-types: '24'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install temporary type-check tools
        env:
          NODE_TYPES: ${{ matrix.node-types }}
        run: npm install --no-save --package-lock=false typescript@5.9.3 "@types/node@${NODE_TYPES}"

      - name: Run backend tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run typecheck
