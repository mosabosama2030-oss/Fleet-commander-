# A0-15 — API Draft (PROPOSED). Not final: depends on DEC-01/02/05/06/07.
# Money: integer minor units (piastre) + currency. Owner is derived from the session, never from the request body.
openapi: 3.0.3
info:
  title: Fleet Commander API (draft)
  version: 0.0.1-draft
servers:
  - url: https://example.invalid/api/v1   # hosting UNKNOWN
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string, example: VALIDATION_FAILED }
        message: { type: string }
        request_id: { type: string }
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, minimum: 0 }
        currency: { type: string, example: EGP }
    Provenance:
      type: string
      enum: [ACTUAL, ESTIMATED, INFERRED, UNKNOWN]
    Shift:
      type: object
      properties:
        id: { type: string }
        vehicle_id: { type: string }
        status: { type: string, enum: [OPEN, CLOSED, CANCELLED] }   # final set pending DEC-06
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
security:
  - session: []
paths:
  /auth/login:    { post: { security: [], summary: Login, responses: { '200': { description: ok }, '401': { description: bad credentials } } } }
  /auth/logout:   { post: { summary: Revoke session, responses: { '204': { description: ok } } } }
  /vehicles:
    get:  { summary: List my vehicles, responses: { '200': { description: ok } } }
    post: { summary: Create vehicle, parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ], responses: { '201': { description: created } } }
  /shifts:
    get:  { summary: List my shifts (paged), responses: { '200': { description: ok } } }
    post: { summary: Start shift, parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ], responses: { '201': { description: created }, '409': { description: conflict } } }
  /shifts/{id}/end:     { post: { summary: End shift, parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' } ], responses: { '200': { description: ok }, '409': { description: invalid state } } } }
  /shifts/{id}/revenue: { post: { summary: Add revenue entry, parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' } ], responses: { '201': { description: created } } } }
  /shifts/{id}/expenses: { post: { summary: Add expense, parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' } ], responses: { '201': { description: created } } } }
  /shifts/{id}/summary: { get: { summary: Deterministic financial summary with Calculation ID, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: ok } } } }
  /settlements:  { post: { summary: Record settlement, parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ], responses: { '201': { description: created } } } }
  /attachments:  { post: { summary: Upload (validated, private), responses: { '201': { description: created }, '415': { description: type rejected } } } }
  /reports:      { get: { summary: Period report, responses: { '200': { description: ok } } } }
  /exports:      { post: { summary: Export own data (audited), responses: { '202': { description: accepted } } } }
