ial, sans-serif" font-size="14" font-weight="800" fill="#102A3A">مساعدك الشخصي</text><rect x="265" y="760" width="112" height="26" rx="13" fill="#FFF4E2" stroke="none"/><text x="321" y="778" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="700" fill="#A66B16">غير مفعّل</text><text x="382" y="796" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="400" fill="#6F8390">يفهم ويساعدك — ولا ينفذ دون موافقتك.</text><text x="382" y="820" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="400" fill="#7772B8">لا توجد إجابة ذكية حية في هذه المعاينة.</text><rect x="0" y="858" width="430" height="74" rx="0" fill="#fff" stroke="#DFE7EA"/><text x="45" y="887" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="20" font-weight="700" fill="#087F7B">⌂</text><text x="45" y="912" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="700" fill="#087F7B">الرئيسية</text><text x="130" y="887" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="20" font-weight="700" fill="#82949E">◷</text><text x="130" y="912" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="500" fill="#6F8390">الشيفت</text><text x="215" y="887" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans