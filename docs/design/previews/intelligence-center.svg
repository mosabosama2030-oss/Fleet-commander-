<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">Fleet Commander — مركز الذكاء الشخصي</title><desc id="desc">تصميم مقترح لمساعد الكابتن الشخصي؛ يوضح حالة التعطيل، مصدر السياق، الاقتراحات، موافقة الإنسان، وسجل الأدلة.</desc><defs><linearGradient id="aiHero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#292653"/><stop offset="1" stop-color="#155E63"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#102A3A" flood-opacity=".06"/></filter></defs><rect x="0" y="0" width="1600" height="1040" rx="0" fill="#F3F6F8" stroke="none"/><rect x="1320" y="0" width="280" height="1040" rx="0" fill="#fff" stroke="#DFE7EA"/><rect x="1360" y="28" width="48" height="48" rx="15" fill="#635BCA" stroke="none"/><text x="1384" y="59" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">FC</text><text x="1548" y="48" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="16" font-weight="800" fill="#102A3A">Fleet Commander</text><text x="1548" y="72" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="400" fill="#6F8390">مساعد الكابتن الذكي</text><line x1="1348" y1="102" x2="1570" y2="102" stroke="#DFE7EA" stroke-width="1"/><text x="1550" y="160" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="13" font-weight="500" fill="#526978">الرئيسية</text><text x="1370" y="160" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto San