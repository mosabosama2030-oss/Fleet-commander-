BM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="400" fill="#6F8390">قواعد فهم أولًا، وLLM احتياطي بعد تمكينه.</text><rect x="75" y="763" width="116" height="26" rx="13" fill="#FFF4E2" stroke="none"/><text x="133" y="781" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="700" fill="#A66B16">البنية جزئية</text><line x1="60" y1="812" x2="1230" y2="812" stroke="#DFE7EA" stroke-width="1"/><text x="1210" y="836" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="12" font-weight="700" fill="#102A3A">فهم صور الفواتير</text><text x="1210" y="857" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="400" fill="#6F8390">استخراج مقترح مع معاينة وتصحيح قبل التسجيل.</text><rect x="75" y="825" width="116" height="26" rx="13" fill="#F0EEFC" stroke="none"/><text x="133" y="843" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="700" fill="#635BCA">مقترح</text><line x1="60" y1="874" x2="1230" y2="874" stroke="#DFE7EA" stroke-width="1"/><text x="1210" y="898" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="12" font-weight="700" fill="#102A3A">ذاكرة التفضيلات</text><text x="1210" y="919" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="400" fill="#6F8390">اختيارية وبموافقة ومدة احتفاظ واضحة.</text><rect x="75" y="887" width="116" height="26" rx="13" fill="#F0EEFC" stroke="none"/><text x="133" y="905" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="700" fill="#635BCA">مقترح</text><rect x="58" y="958" width="1204" height="48" rx="14" fill="#E8F3F2" stroke="#CFE7E3"/><text x="1232" y="988" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="600" fill="#315F5E">قاعدة التحكم: الاقتراح ليس أمرًا. التنفيذ عبر Backend مخوّل وبعد تأكيدك ثم إقرار الخادم.</text></svg>