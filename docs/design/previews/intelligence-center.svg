unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="14" font-weight="800" fill="#102A3A">حالة منظومة الذكاء</text><text x="1225" y="373" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="400" fill="#6F8390">بوابة LLM موجودة في الخلفية، لكنها تبدأ مغلقة افتراضيًا.</text><rect x="850" y="341" width="184" height="26" rx="13" fill="#FFF4E2" stroke="none"/><text x="942" y="359" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="700" fill="#A66B16">LLM Gateway: Disabled</text><text x="1228" y="456" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="16" font-weight="800" fill="#102A3A">كيف يعمل المساعد؟</text><rect x="960" y="480" width="276" height="138" rx="16" fill="#fff" stroke="#DFE7EA"/><rect x="1178" y="496" width="40" height="40" rx="12" fill="#E6F4F2" stroke="none"/><text x="1198" y="522" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="12" font-weight="800" fill="#087F7B">01</text><text x="1164" y="552" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="14" font-weight="800" fill="#102A3A">سياق موثوق</text><text x="1164" y="579" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="400" fill="#6F8390">مصدره سجل مؤكد أو يصرّح بأنه غير متاح.</text><rect x="660" y="480" width="276" height="138" rx="16" fill="#fff" stroke="#DFE7EA"/><rect x="878" y="496" width="40" 