<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">Fleet Commander — مسارات الكابتن</title><desc id="desc">لوحة مرجعية لست شاشات: الدخول، بدء الشيفت، أثناء الشيفت، الرحلة، المصروفات، موافقة GPS؛ كلها مقترحات تصميمية وليست شاشات متصلة.</desc><defs><filter id="fs" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#102A3A" flood-opacity=".07"/></filter></defs><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#F3F6F8" stroke="none"/><text x="1540" y="55" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="26" font-weight="800" fill="#102A3A">مسارات الكابتن الأساسية</text><text x="1540" y="82" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F8390">مخططات واجهة أولية — الحالات والحقول النهائية تخضع للعقد والقرارات</text><rect x="60" y="125" width="450" height="400" rx="20" fill="#fff" stroke="#DFE7EA"/><rect x="78" y="143" width="414" height="5" rx="3" fill="#2B6D9A" stroke="none"/><text x="480" y="179" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="17" font-weight="800" fill="#102A3A">01 • تسجيل الدخول</text><rect x="78" y="197" width="172" height="24" rx="12" fill="#2B6D9A18" stroke="none"/><text x="164" y="214" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="700" fill="#2B6D9A">مصادقة مؤكدة من الخادم</text><text x="480" y="257" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="500" fill="#6F8390">دخول بالبريد وكلمة المرور</text><rect x="86" y="290" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="465" y="317" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#405B6B">البريد الإلكتروني</text><rect x="86" y="342" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="465" y="369" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#6F8390">كلمة المرور</text><rect x="86" y="451" width="398" height="42" rx="11" fill="#2B6D9A" stroke="none"/><text x="285" y="478" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">تسجيل الدخول</text><text x="480" y="514" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="500" fill="#7B8B94">لا دخول ناجح قبل إقرار الخادم.</text><rect x="575" y="125" width="450" height="400" rx="20" fill="#fff" stroke="#DFE7EA"/><rect x="593" y="143" width="414" height="5" rx="3" fill="#087F7B" stroke="none"/><text x="995" y="179" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="17" font-weight="800" fill="#102A3A">02 • بدء الشيفت</text><rect x="593" y="197" width="172" height="24" rx="12" fill="#087F7B18" stroke="none"/><text x="679" y="214" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="700" fill="#087F7B">إجراء حساس</text><text x="995" y="257" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="500" fill="#6F8390">مركبة نشطة واحدة — وفق حالة الخادم</text><rect x="601" y="290" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="980" y="317" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#405B6B">المركبة النشطة</text><rect x="601" y="342" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="980" y="369" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#6F8390">بيانات البداية (بعد اعتمادها)</text><rect x="601" y="451" width="398" height="42" rx="11" fill="#087F7B" stroke="none"/><text x="800" y="478" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">بدء الشيفت</text><text x="995" y="514" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="500" fill="#7B8B94">لا نعلن بداية مؤكدة من الجهاز وحده.</text><rect x="1090" y="125" width="450" height="400" rx="20" fill="#fff" stroke="#DFE7EA"/><rect x="1108" y="143" width="414" height="5" rx="3" fill="#087F7B" stroke="none"/><text x="1510" y="179" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="17" font-weight="800" fill="#102A3A">03 • أثناء الشيفت</text><rect x="1108" y="197" width="172" height="24" rx="12" fill="#087F7B18" stroke="none"/><text x="1194" y="214" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="700" fill="#087F7B">حالة OPEN مؤكدة</text><text x="1510" y="257" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="500" fill="#6F8390">إجراءات مختصرة عند التوقف بأمان</text><rect x="1116" y="290" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="1495" y="317" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#405B6B">حالة الشيفت: غير متصلة</text><rect x="1116" y="342" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="1495" y="369" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#6F8390">رحلة جديدة • مصروف جديد</text><rect x="1116" y="451" width="398" height="42" rx="11" fill="#087F7B" stroke="none"/><text x="1315" y="478" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">مراجعة إنهاء الشيفت</text><text x="1510" y="514" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="500" fill="#7B8B94">لا تفاعل مطول أثناء القيادة.</text><rect x="60" y="595" width="450" height="400" rx="20" fill="#fff" stroke="#DFE7EA"/><rect x="78" y="613" width="414" height="5" rx="3" fill="#2B6D9A" stroke="none"/><text x="480" y="649" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="17" font-weight="800" fill="#102A3A">04 • إضافة رحلة</text><rect x="78" y="667" width="172" height="24" rx="12" fill="#2B6D9A18" stroke="none"/><text x="164" y="684" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="700" fill="#2B6D9A">إدخال يدوي</text><text x="480" y="727" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="500" fill="#6F8390">تسجيل رحلة واحدة</text><rect x="86" y="760" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="465" y="787" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#405B6B">منصة النقل / المصدر</text><rect x="86" y="812" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="465" y="839" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#6F8390">المبلغ كما أدخله الكابتن</text><rect x="86" y="864" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="465" y="891" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#6F8390">وقت الرحلة / ملاحظة</text><rect x="86" y="921" width="398" height="42" rx="11" fill="#2B6D9A" stroke="none"/><text x="285" y="948" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">إرسال الرحلة</text><text x="480" y="984" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="500" fill="#7B8B94">إظهار النجاح فقط بعد تأكيد الخادم.</text><rect x="575" y="595" width="450" height="400" rx="20" fill="#fff" stroke="#DFE7EA"/><rect x="593" y="613" width="414" height="5" rx="3" fill="#A66B16" stroke="none"/><text x="995" y="649" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="17" font-weight="800" fill="#102A3A">05 • إضافة مصروف</text><rect x="593" y="667" width="172" height="24" rx="12" fill="#A66B1618" stroke="none"/><text x="679" y="684" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="700" fill="#A66B16">قرار تصنيف/عملة مطلوب</text><text x="995" y="727" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="500" fill="#6F8390">مصروف يدوي مع حقل تصنيف معتمد</text><rect x="601" y="760" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="980" y="787" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#405B6B">التصنيف — غير معتمد بعد</text><rect x="601" y="812" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="980" y="839" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#6F8390">القيمة والعملة — غير محسومتين</text><rect x="601" y="864" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="980" y="891" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#6F8390">صورة إيصال — قدرة مستقبلية</text><rect x="601" y="921" width="398" height="42" rx="11" fill="#A66B16" stroke="none"/><text x="800" y="948" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">إرسال المصروف</text><text x="995" y="984" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="500" fill="#7B8B94">لا تُعرض معادلات أو صافي تخميني.</text><rect x="1090" y="595" width="450" height="400" rx="20" fill="#fff" stroke="#DFE7EA"/><rect x="1108" y="613" width="414" height="5" rx="3" fill="#635BCA" stroke="none"/><text x="1510" y="649" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="17" font-weight="800" fill="#102A3A">06 • موافقة GPS</text><rect x="1108" y="667" width="172" height="24" rx="12" fill="#635BCA18" stroke="none"/><text x="1194" y="684" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="700" fill="#635BCA">موافقة صريحة</text><text x="1510" y="727" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="500" fill="#6F8390">قبل طلب صلاحية الموقع</text><rect x="1116" y="760" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="1495" y="787" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#405B6B">لماذا نحتاج الموقع؟</text><rect x="1116" y="812" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="1495" y="839" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#6F8390">مدة الاحتفاظ — تحتاج قرارًا</text><rect x="1116" y="864" width="398" height="43" rx="10" fill="#F8FAFB" stroke="#DFE7EA"/><text x="1495" y="891" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="10" font-weight="500" fill="#6F8390">الحالة: لم يُطلب</text><rect x="1116" y="921" width="398" height="42" rx="11" fill="#635BCA" stroke="none"/><text x="1315" y="948" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">مراجعة الموافقة</text><text x="1510" y="984" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="9" font-weight="500" fill="#7B8B94">لا وعد بتتبع خلفي موثوق في PWA.</text><rect x="60" y="1034" width="1480" height="54" rx="14" fill="#E8F3F2" stroke="#CFE7E3"/><text x="1510" y="1067" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-size="12" font-weight="600" fill="#315F5E">حالة الإرسال المشتركة: IDLE → SUBMITTING → CONFIRMED أو ERROR / OUTCOME_UNKNOWN — لا نجاح افتراضي، ولا إعادة إرسال صامتة.</text></svg>