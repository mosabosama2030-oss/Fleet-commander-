# A1-06 — Core API contract (PROPOSED). Non-financial resources only: auth, session, profile, vehicles, attachments, errors, pagination.
# Depends on DEC-07 (auth method), DEC-08 (hosting), DEC-12 (attachment policy). Shift/revenue/expense/settlement paths stay in docs/a0/API_DRAFT.openapi.yaml until DEC-01..06 are decided.
# Ownership: owner_user_id is ALWAYS derived from the session. It never appears in request bodies; unknown fields are rejected.
openapi: 3.0.3
info:
  title: Fleet Commander Core API
  version: 0.1.0-draft
servers:
  - url: https://example.invalid/api/v1   # hosting UNKNOWN
security:
  - session: []
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: Short-lived access token. Revocable. Refresh policy PROPOSED in SECURITY_DESIGN_AR.md.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    VehicleId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized: { description: No or invalid session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound:     { description: Not found OR not owned (indistinguishable by design), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Validation:   { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited:  { description: Too many requests, headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict:     { description: Conflict or idempotency mismatch, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHENTICATED, NOT_FOUND, CONFLICT, IDEMPOTENCY_KEY_REUSED, RATE_LIMITED, UNSUPPORTED_MEDIA_TYPE, PAYLOAD_TOO_LARGE, INTERNAL]
        message: { type: string }
        request_id: { type: string }
        fields:
          type: array
          items: { type: object, properties: { name: { type: string }, reason: { type: string } } }
    Page:
      type: object
      required: [items]
      properties:
        items: { type: array, items: {} }
        next_cursor: { type: string, nullable: true }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login_identifier, password]
      properties:
        login_identifier: { type: string }
        password: { type: string, format: password }
    TokenResponse:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
    Profile:
      type: object
      properties:
        display_name: { type: string, maxLength: 80 }
        timezone: { type: string, example: Africa/Cairo }
    Vehicle:
      type: object
      required: [id, label, status]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, maxLength: 60 }
        plate_ref: { type: string, maxLength: 20 }
        status: { type: string, enum: [active, retired] }
    VehicleCreate:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string, maxLength: 60 }
        plate_ref: { type: string, maxLength: 20 }
    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        media_type: { type: string, enum: [image/jpeg, image/png] }   # PROPOSED (DEC-12)
        size_bytes: { type: integer, maximum: 5242880 }                # 5 MB PROPOSED, not approved
        checksum_sha256: { type: string }
paths:
  /auth/login:
    post:
      security: []
      summary: Login (DEC-07 VERIFIED email+password)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post: { summary: Revoke current session, responses: { '204': { description: ok }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /me:
    get:
      summary: My profile
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
    patch:
      summary: Update my profile
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
      responses: { '200': { description: ok }, '422': { $ref: '#/components/responses/Validation' } }
  /vehicles:
    get:
      summary: List my vehicles
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses: { '200': { description: ok }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      summary: Create vehicle. DEC-01 (VERIFIED) = one vehicle only; 409 if an active vehicle exists (retire it first via PATCH status=retired)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VehicleCreate' } } } }
      responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Vehicle' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Validation' } }
  /vehicles/{id}:
    parameters: [ { $ref: '#/components/parameters/VehicleId' } ]
    get:   { summary: Get my vehicle, responses: { '200': { description: ok }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch: { summary: Update my vehicle, responses: { '200': { description: ok }, '404': { $ref: '#/components/responses/NotFound' } } }
  /auth/password-reset/request:
    post:
      security: []
      summary: Request recovery email (always 202; never reveals whether the account exists)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [login_identifier], properties: { login_identifier: { type: string } } } } } }
      responses: { '202': { description: accepted }, '429': { $ref: '#/components/responses/RateLimited' } }
  /auth/password-reset/confirm:
    post:
      security: []
      summary: Set new password with one-time short-lived token (revokes all sessions)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [token, new_password], properties: { token: { type: string }, new_password: { type: string, format: password } } } } } }
      responses: { '204': { description: ok }, '422': { $ref: '#/components/responses/Validation' } }
  /consents:
    get:  { summary: List my consents, responses: { '200': { description: ok } } }
    post:
      summary: Grant consent (DEC-10 purpose shift_location only)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [purpose], properties: { purpose: { type: string, enum: [shift_location] } } } } } }
      responses: { '201': { description: created }, '422': { $ref: '#/components/responses/Validation' } }
  /consents/{id}:
    delete: { summary: Revoke consent (stops location acceptance immediately; deletion of past points per retention policy UNKNOWN), parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ], responses: { '204': { description: ok }, '404': { $ref: '#/components/responses/NotFound' } } }
  /shifts/{id}/locations:
    post:
      summary: Submit location points (batch) for an OPEN shift; rejected without active consent
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [points], properties: { points: { type: array, maxItems: 100, items: { type: object, required: [lat, lon, captured_at], properties: { lat: { type: number, minimum: -90, maximum: 90 }, lon: { type: number, minimum: -180, maximum: 180 }, accuracy_m: { type: number, minimum: 0 }, captured_at: { type: string, format: date-time } } } } } } } } }
      responses: { '202': { description: accepted }, '403': { description: no active consent }, '409': { description: shift not OPEN }, '404': { $ref: '#/components/responses/NotFound' } }
  /attachments:
    post:
      summary: Upload (multipart; server validates type by content, size, ownership)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Attachment' } } } }, '413': { description: too large }, '415': { description: type rejected } }
  /attachments/{id}/content:
    get:
      summary: Download own attachment (authorized stream or short-lived signed URL)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: file }, '404': { $ref: '#/components/responses/NotFound' } }
